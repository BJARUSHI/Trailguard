name: trailguard
description: TrailGuard - Offline Intelligent Hiker Safety System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  sqflite: 2.3.3+1
  path_provider: ^2.1.1
  path: ^1.8.3
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.1.2
  fl_chart: ^0.68.0
  permission_handler: ^11.1.0
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.0.3
  vector_math: ^2.1.4
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/maps/
    - assets/sounds/
